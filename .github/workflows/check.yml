name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e . ruff==0.16.10
      - run: python scripts/check.py bot
      - run: python scripts/check.py policy
      - run: ruff check --select F src tests tools scripts
      - run: ruff format --check src tests tools scripts
      - run: python scripts/audit_public.py --tracked
